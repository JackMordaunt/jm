# Type-checks every package for every target, then on Linux, macOS and
# Windows links every program and runs the test suite, through the
# justfile's own link and test recipes so the packages are found one way.
# The native libraries are built here the way the justfile builds them: the
# vendored SQLite, wasm3 and libpg_query with the platform's C compiler,
# libgit2 and Blend2D with CMake from pinned upstream checkouts, cached
# between runs.
#
# It runs on a push to main, and on a push to any ci/<name> branch, so a
# throwaway branch gets the three platforms during development without
# every feature branch paying for them; `gh workflow run test.yml --ref
# <branch>` runs it on any other branch.
#
# SDL3 comes from Homebrew on macOS and with Odin on Windows; Ubuntu has no
# package, so it is built here, console-only, which links and runs ui/sdl's
# tests because they drive a child process rather than open a window. The
# pq tests skip themselves on a runner where the PostgreSQL server binaries
# are not on PATH; the package still has to link libpq, so SKIP leaves pq
# and jm-fuzz out where there is no libpq to link. wasm-windows.yml is the
# shorter loop for jm:wasm on Windows alone.
name: test
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
env:
  ODIN_RELEASE: dev-2026-09
  LIBGIT2_TAG: v1.9.7
  BLEND2D_REF: 58ca9460b4138af6e793184682e9324e0a8053b2
  ASMJIT_REF: 0d7f01052f2d3f6d6b9bb6714ef32bd7b80177eb
  # The release vendor:sdl3 in ODIN_RELEASE is bound against.
  SDL3_TAG: release-3.4.2
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d  # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b  # v3.1.0
      - run: just check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The Windows runner's git converts line endings on checkout and
      # libgit2 honours the same setting when it checks a pull out, so the
      # tests that compare file bytes would read CRLF where they wrote LF.
      - name: keep line endings as committed (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d  # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b  # v3.1.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        if: runner.os == 'Windows'

      # What each platform needs beyond its compilers: libcurl for jm:http,
      # libpq and a PostgreSQL server for jm:pq, and the fonts the render
      # tests name. The Odin release's vendor:curl also names mbedtls on
      # Linux, which the system libcurl does not use; empty archives satisfy
      # those flags.
      - name: platform packages (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libpq-dev postgresql fonts-liberation cmake ninja-build
          sudo mkdir -p /usr/share/fonts/liberation
          sudo ln -sf /usr/share/fonts/truetype/liberation/*.ttf /usr/share/fonts/liberation/
          mkdir -p "$RUNNER_TEMP/stubs"
          for l in mbedtls mbedx509 mbedcrypto; do ar rcs "$RUNNER_TEMP/stubs/lib$l.a"; done
          echo "LINKFLAGS=-L$RUNNER_TEMP/stubs" >> "$GITHUB_ENV"
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - name: platform packages (macos)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet postgresql@17 libpq ninja sdl3
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          # Homebrew keeps libpq keg-only, and postgresql@17's own copy
          # sits under lib/postgresql@17; the libpq formula's lib is the
          # plain path to link.
          echo "LINKFLAGS=-L$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"
      - name: platform packages (windows)
        if: runner.os == 'Windows'
        run: |
          # An 8 MB stack, as Linux and macOS threads get: wasm3 interprets a
          # wasm call as a C call, and its stack-exhaustion trap needs more
          # than the 1 MB a Windows thread has by default. The PE header's
          # reserve is what CreateThread gives a thread that asks for 0, so
          # the test runner's workers get it too.
          link="/STACK:8388608"
          if [ -n "${PGROOT:-}" ] && [ -f "$PGROOT/lib/libpq.lib" ]; then
            echo "$PGBIN" >> "$GITHUB_PATH"
            # The 8.3 spelling: the linker splits a /LIBPATH at the space in
            # "Program Files".
            link="$link /LIBPATH:$(cygpath -d "$PGROOT/lib")"
          else
            echo "no PostgreSQL on this image: pq is left out"
            echo "SKIP=pq tools/jm-fuzz" >> "$GITHUB_ENV"
          fi
          echo "LINKFLAGS=$link" >> "$GITHUB_ENV"

      # SDL3 for ui/sdl and the demo hosts on Linux, shared so the tests
      # load it through LD_LIBRARY_PATH. Console-only: no X11 or Wayland
      # headers are installed, and nothing here opens a window.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: runner.os == 'Linux'
        id: sdl3
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL3_TAG }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: sdl3 (linux)
        if: runner.os == 'Linux' && steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL "$RUNNER_TEMP/sdl3-src"
          cmake -S "$RUNNER_TEMP/sdl3-src" -B "$RUNNER_TEMP/sdl3-src/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl3-src/build" --parallel
          cmake --install "$RUNNER_TEMP/sdl3-src/build"
      - name: sdl3 on the linker path (linux)
        if: runner.os == 'Linux'
        run: |
          lib=$(dirname "$(find "$RUNNER_TEMP/sdl3" -name 'libSDL3.so' -print -quit)")
          echo "LINKFLAGS=$LINKFLAGS -L$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"

      # The vendored C libraries, compiled as the justfile compiles them.
      # On Windows the recipes are written for PowerShell and just's parser
      # trips over the file there, so the same commands run directly.
      - name: sqlite, zstd, wasm3, libpg_query, kb_text_shape (unix)
        if: runner.os != 'Windows'
        run: just sqlite zstd wasm pg_query kb
      - name: sqlite, zstd, wasm3, libpg_query, kb_text_shape (windows)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          value() { sed -n "/^$1 :=/,/[^\\\\]$/p" justfile | grep -o '"[^"]*"' | tr -d '"' | tr -d '\n'; }
          sqlite_defines=$(value sqlite_defines)
          wasm_defines=$(value wasm_defines)
          pg_query_flags=$(value pg_query_flags | sed 's/-fno-strict-aliasing//; s/-fwrapv//; s/-fPIC//; s/-O2//; s/-Wno-[a-z-]*//g')
          mkdir -p sqlite3/lib zstd/lib wasm/lib/obj pg_query/lib/obj ui/kb/lib
          cl -nologo -O2 -c sqlite3/vendor/sqlite3.c -Fosqlite3/lib/sqlite3.obj $sqlite_defines
          lib -nologo -OUT:sqlite3/lib/sqlite3.lib sqlite3/lib/sqlite3.obj
          cl -nologo -O2 -c zstd/vendor/zstd.c -Fozstd/lib/zstd.obj
          lib -nologo -OUT:zstd/lib/zstd.lib zstd/lib/zstd.obj
          cl -nologo -std:c11 -O2 -c ui/kb/vendor/kb_text_shape.c -Foui/kb/lib/kb_text_shape.obj
          lib -nologo -OUT:ui/kb/lib/kb_text_shape.lib ui/kb/lib/kb_text_shape.obj
          # wasm3 is C11 that MSVC's cl rejects (m3_exec.h); clang-cl takes it.
          for f in wasm/vendor/*.c; do clang-cl -nologo -O2 -I wasm/vendor $wasm_defines -c "$f" -Fowasm/lib/obj/ || exit 1; done
          lib -nologo -OUT:wasm/lib/wasm3.lib wasm/lib/obj/*.obj
          # cl prints its errors on stdout, so nothing here is discarded;
          # only the per-file name echo is filtered out.
          # The same file set as the unix recipe: a recursive find would also
          # sweep up .c files under the include and vendor trees.
          for f in pg_query/vendor/src/*.c pg_query/vendor/src/postgres/*.c pg_query/vendor/protobuf/*.c pg_query/vendor/vendor/*/*.c; do
            cl -nologo -O2 $pg_query_flags -I pg_query/vendor/src/postgres/include -I pg_query/vendor/src/postgres/include/port/win32 -I pg_query/vendor/src/postgres/include/port/win32_msvc -c "$f" -Fopg_query/lib/obj/ | grep -v '^[A-Za-z0-9_.-]*\.c$' || true
            [ -f "pg_query/lib/obj/$(basename "${f%.c}").obj" ] || { echo "::error::$f did not compile"; exit 1; }
          done
          lib -nologo -OUT:pg_query/lib/pg_query.lib pg_query/lib/obj/*.obj

      # libgit2, static, from the tag the binding was written against, with
      # the platform's HTTPS and ssh through the platform's binary.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: libgit2
        with:
          path: git/lib
          key: libgit2-${{ env.LIBGIT2_TAG }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$LIBGIT2_TAG" https://github.com/libgit2/libgit2 "$RUNNER_TEMP/libgit2"
          case "$RUNNER_OS" in
            Linux)   https=OpenSSL-Dynamic; gen="-G Ninja" ;;
            macOS)   https=SecureTransport; gen="-G Ninja" ;;
            Windows) https=WinHTTP; gen="-G Ninja -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" ;;
          esac
          cmake -S "$RUNNER_TEMP/libgit2" -B "$RUNNER_TEMP/libgit2/build" $gen -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_SSH=exec -DUSE_HTTPS=$https \
            -DUSE_BUNDLED_ZLIB=ON -DREGEX_BACKEND=builtin -DUSE_HTTP_PARSER=builtin -DUSE_NTLMCLIENT=OFF -DUSE_SHA256=builtin
          cmake --build "$RUNNER_TEMP/libgit2/build" --parallel
          mkdir -p git/lib
          if [ "$RUNNER_OS" = Windows ]; then cp "$RUNNER_TEMP/libgit2/build/git2.lib" git/lib/; else cp "$RUNNER_TEMP/libgit2/build/libgit2.a" git/lib/; fi

      # Blend2D, static, with asmjit beside it as its build expects.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: blend2d
        with:
          path: ui/blend2d/lib
          key: blend2d-${{ env.BLEND2D_REF }}-${{ env.ASMJIT_REF }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: blend2d
        if: steps.blend2d.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/blend2d/blend2d "$RUNNER_TEMP/blend2d"
          git -C "$RUNNER_TEMP/blend2d" checkout -q "$BLEND2D_REF"
          git clone -q https://github.com/asmjit/asmjit "$RUNNER_TEMP/blend2d/3rdparty/asmjit"
          [ "$ASMJIT_REF" = master ] || git -C "$RUNNER_TEMP/blend2d/3rdparty/asmjit" checkout -q "$ASMJIT_REF"
          gen="-G Ninja"
          [ "$RUNNER_OS" = Windows ] && gen="-G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake -S "$RUNNER_TEMP/blend2d" -B "$RUNNER_TEMP/blend2d/build" $gen -DCMAKE_BUILD_TYPE=Release -DBLEND2D_STATIC=ON -DBLEND2D_TEST=OFF
          cmake --build "$RUNNER_TEMP/blend2d/build" --parallel
          mkdir -p ui/blend2d/lib
          if [ "$RUNNER_OS" = Windows ]; then cp "$RUNNER_TEMP/blend2d/build/blend2d.lib" ui/blend2d/lib/; else cp "$RUNNER_TEMP/blend2d/build/libblend2d.a" ui/blend2d/lib/; fi

      # AccessKit: the pinned release's prebuilt library, checked by hash:
      # the static archive on Linux and macOS, the DLL on Windows.
      - name: accesskit
        env:
          MSYS_NO_PATHCONV: 1
        run: just accesskit

      # Every program linked, then the suite, as `just link test` runs them
      # anywhere. --no-deps: the native libraries are built above, because
      # the recipes that build them on Windows are written for PowerShell.
      - name: build and test
        env:
          MSYS_NO_PATHCONV: 1
        run: just --no-deps hot-counter-child link test

      # The one network step: an anonymous HTTPS clone through the static
      # libgit2 and the platform's own TLS.
      - name: git-probe (anonymous https)
        run: build/debug/tools-git-probe https://github.com/octocat/Hello-World.git
